[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leanputer"
version = "0.1.0"
description = "Bounded lambda-calculus checking compiled into residual ReLU weights"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.6"]

[project.scripts]
leanputer = "leanputer.__main__:main"
leanputer-research = "leanputer.research:main"
leanputer-export = "leanputer.preparation:main"

[tool.setuptools.packages.find]
include = ["leanputer*"]

[tool.setuptools.data-files]
"share/leanputer/lean" = ["tools/lean/Export.lean", "tools/lean/Validate.lean", "tools/lean/Enumerate.lean"]

[project.optional-dependencies]
native = ["torch>=2.8", "transformers==5.19.0; python_version >= '3.11'", "numpy>=1.26"]

[tool.setuptools.package-data]
"leanputer.native_vendor.qwenputer" = ["LICENSE", "PROVENANCE.md"]
